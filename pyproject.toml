[project]
name = "ares-job-search"
version = "0.1.0"
description = "AI-powered job search automation for Windows"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "python-jobspy>=1.1.0",
    "pandas>=2.1.2,<3.0",
    "requests>=2.31.0",
    "google-api-python-client>=2.100.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.1.0",
    "google-genai>=1.0.0",
    "playwright>=1.40.0",
    "sqlalchemy>=2.0.0",
    "openpyxl>=3.1.0",
    "gspread>=6.0.0",
    "google-auth>=2.25.0",
    "jinja2>=3.1.0",
    "pymupdf>=1.23.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "rapidfuzz>=3.5.0",
    "winotify>=1.1.0",
]

[project.optional-dependencies]
weasyprint = ["weasyprint>=60.0"]
dev = ["pytest>=8.0.0"]
